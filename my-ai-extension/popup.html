<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 360px; height: 550px; display: flex; flex-direction: column; background: #0f172a; color: #f8fafc; }
    header { padding: 12px 16px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 16px; font-weight: 600; }
    .icon-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; }
    #chat-container { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #3b82f6; color: #fff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    footer { padding: 10px; background: #1e293b; display: flex; gap: 8px; border-top: 1px solid #334155; }
    textarea { flex: 1; height: 40px; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; resize: none; font-size: 14px; outline: none; }
    #send-btn { background: #3b82f6; border: none; color: white; border-radius: 8px; padding: 0 16px; font-weight: 600; cursor: pointer; }
    #send-btn:disabled { opacity: 0.5; }
    
    /* Settings Modal */
    #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); padding: 20px; flex-direction: column; justify-content: center; z-index: 10; }
    .modal-content { background: #1e293b; padding: 18px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; }
    .modal-content label { font-size: 12px; color: #94a3b8; }
    .modal-content input, .modal-content select { padding: 8px 10px; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: #fff; outline: none; }
    .save-btn { background: #10b981; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .close-btn { background: #475569; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>AI Chat</h1>
    <button id="open-settings" class="icon-btn" title="Settings">⚙️</button>
  </header>

  <div id="chat-container">
    <div class="message bot">স্বাগতম! আপনি সেটিংস আইকনে (⚙️) ক্লিক করে আপনার API Key বসিয়ে চ্যাট শুরু করতে পারেন।</div>
  </div>

  <footer>
    <textarea id="prompt-input" placeholder="এখানে মেসেজ লিখুন..."></textarea>
    <button id="send-btn">Send</button>
  </footer>

  <div id="settings-modal">
    <div class="modal-content">
      <h3 style="font-size: 16px;">API Settings</h3>
      
      <label>AI Model Provider</label>
      <select id="provider-select">
        <option value="gemini">Google Gemini (Gemini API Key)</option>
        <option value="claude">Anthropic Claude (Claude API Key)</option>
      </select>

      <label>Google API Key</label>
      <input type="password" id="google-key-input" placeholder="AIzaSy...">

      <label>Claude API Key</label>
      <input type="password" id="claude-key-input" placeholder="sk-ant-...">

      <button id="save-settings" class="save-btn">Save Settings</button>
      <button id="close-settings" class="close-btn">Close</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
